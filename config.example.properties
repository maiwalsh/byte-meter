# Kafka connection
bootstrap.servers=localhost:9092

# Consumer group for the meter
application.id=raw-byte-meter

# Topic selection:
#   topics.mode=list     uses source.topics below
#   topics.mode=discover asks Kafka for non-internal topics and excludes exclude.topics
topics.mode=list
source.topics=orders,users,payments
exclude.topics=raw-byte-summary

# Output topic for JSON summaries
summary.topic=raw-byte-summary

# Emit one JSON summary per topic every N seconds.
# This is the fast feedback loop for testing and dashboards.
summary.interval.seconds=60

# Also emit hourly rollups to the same summary topic.
hourly.enabled=true

# For live measurement use latest. For a deliberate backfill/smoke replay use earliest
# with a fresh application.id.
auto.offset.reset=latest

# Operational logging cadence
log.interval.seconds=30

# Offset commits are retried on this cadence. Larger values reduce commit chatter.
commit.interval.seconds=30

# --- Assembler (mode "assemble") ---
# Consumes summary.topic above and compiles all per-topic summaries for a
# completed window into a single JSON report, written to reports.topic.
reports.topic=raw-byte-reports

# Consumer group for the assembler
assembler.application.id=raw-byte-assembler

# A window is considered complete once no new summary record for it has
# arrived for this many seconds.
assemble.idle.seconds=5

# Offset reset for the assembler's consumer group. Defaults to earliest so
# it picks up any existing summary records on first start. Set to latest
# if you only want reports from windows that complete after the assembler starts.
assembler.auto.offset.reset=earliest

